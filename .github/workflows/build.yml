name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            dist: dist:win
          - name: macOS
            os: macos-latest
            dist: dist:mac
          - name: Linux
            os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check formatting
        if: runner.os == 'Linux'
        run: npx prettier --check .

      - name: Typecheck, build and package
        run: npm run ${{ matrix.dist }} -- --publish never

      - name: Smoke test (launch packaged app)
        if: runner.os != 'Linux'
        run: node .github/scripts/smoke.mjs screenshot-${{ runner.os }}.png

      - name: Install CJK fonts for screenshots
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Smoke test (launch packaged app)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node .github/scripts/smoke.mjs screenshot-${{ runner.os }}.png

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/*.AppImage

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-${{ runner.os }}
          if-no-files-found: ignore
          path: screenshot-${{ runner.os }}.png

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Measure Electron
        shell: bash
        run: |
          python -m pip install psutil
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a python .github/scripts/measure.py electron; else python .github/scripts/measure.py electron; fi

  tauri:
    name: Tauri / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev fonts-noto-cjk imagemagick
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run tauri:build -- --bundles ${{ runner.os == 'Windows' && 'nsis' || runner.os == 'macOS' && 'dmg' || 'appimage' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Launch and measure Tauri
        shell: bash
        run: |
          python -m pip install psutil pillow
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a python .github/scripts/measure.py tauri; else python .github/scripts/measure.py tauri; fi
      - uses: actions/upload-artifact@v7
        with:
          name: installers-Tauri-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: screenshot-Tauri-${{ runner.os }}
          path: screenshot-Tauri.png

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          generate_release_notes: true
