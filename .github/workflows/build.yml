name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            dist: dist:win
          - name: macOS
            os: macos-latest
            dist: dist:mac
          - name: Linux
            os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Check formatting
        if: runner.os == 'Linux'
        run: npx prettier --check .

      - name: Typecheck, build and package
        run: npm run ${{ matrix.dist }} -- --publish never

      - name: Smoke test (launch packaged app)
        if: runner.os != 'Linux'
        run: node .github/scripts/smoke.mjs screenshot-${{ runner.os }}.png

      - name: Smoke test (launch packaged app)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node .github/scripts/smoke.mjs screenshot-${{ runner.os }}.png

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/*.AppImage

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ runner.os }}
          if-no-files-found: ignore
          path: screenshot-${{ runner.os }}.png

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
